context:
  initial_state: >-
    刚安装好程序，并且双端程序刚开始正常运行，所有权限均已授予，且双端均未进行任何操作的一种状态
  switched_interface_definition: >-
    在软件内或软件在后台运行时，下一步或当前进入的界面，比如进入一个程序等，
    包括但不限于当前软件内，系统软件内，其它手机软件内（只针对手机端）
  abbreviations:
    M: "mistake，出现的错误（包括但不限于代码，逻辑等错误）"
    L: "了解详细信息"
    S: "solve，我给出的解决方案"
    W: "Warning，警告或不对的逻辑（优先级小于M中错误的逻辑）"

solutions:
  - &S1
    id: S1
    description: >-
      去掉后者的记录，仅保留前者的记录，并且检查代码，
      了解为什么会多这个重复记录，并修复

  - &S2
    id: S2
    description: "显示记录时进行判断，只有复制的内容才显示"

  - &S3
    id: S3
    description: >-
      手机端接收到重名文件后，通知和软件内都要出现一个选项。
      通知里出现如何处理重名文件的操作，软件内出现弹窗，
      也是如何处理重名文件的操作。可选的操作有：
      "覆盖原有文件"、
      "添加编号接收（手机端的选项显示时不包括当前括号内的内容，
      编号添加在后缀之前，按照自然数递增添加编号，
      比如已有a.txt，则收到a.txt → a_1.txt，
      已有a.txt, a_1.txt, 则收到a.txt → a_2.txt）"、
      "取消接收"

  - &S4
    id: S4
    description: >-
      手机内的逻辑：不管在不在软件里，收到电脑文件端发来的文件时，
      应该先显示手机通知，再在软件里显示，实现双重通知。
      并且添加一个开始下载的按钮，用户只有点击通知上的开始下载
      或软件内的开始下载按钮才能开始下载文件。
      手机端通过文件传输接收到的文件应该保存到 /sdcard/Download/ 下，
      而不是 /Android/data/<包名>/files/Downloads/PhoneHub/。

  - &S5
    id: S5
    description: >-
      初始状态下，点击电脑端投屏与反向控制界面里手机投屏到电脑按钮后，
      手机自动进入无障碍权限和录屏权限授予的界面（如已经授予则跳过），
      然后自动开始投屏，电脑端自动弹窗投屏窗口。
      手机端全程切换的界面只有授予权限的那一个界面。
      据此，应该删除的按钮有：
      手机端内"投屏+反向控制"内的"启动推流"按钮；
      电脑端"投屏与反向控制"内的"打卡投屏窗口"按钮。

  - &S6
    id: S6
    description: >-
      初始状态下，点击电脑端"投屏与反向控制"界面里"开始声音传输"的按钮后，
      手机自动获取所需的权限，然后自动开始声音传输，
      电脑端自动开始接收并播放手机端传输的声音。
      手机端全程不切换任何界面。
      据此，应该删除的按钮有：
      手机端内"投屏+反向控制"内的"声韵传输"按钮；
      电脑端没有按钮需要删除。

  - &S7a
    id: S7a
    description: "电脑端应该再来个单独的状态显示器，来提醒用户已静音"

  - &S7b
    id: S7b
    description: >-
      电脑端检测到当前新设置的音量为手机端发送的新音量时，
      只更新拖拽条的UI显示，不传输音量。

  - &S7c
    id: S7c
    description: >-
      首先联网搜索截图的逻辑与代码，然后参照搜索到的代码修复。
      点击截图后手机端静默截图（锁屏时电脑提示手机当前状态不允许截屏），
      然后保存到手机系统相册后，发送给电脑，
      电脑保存到 "F:\desk\手机上传\截图"

  - &S8a
    id: S8a
    description: >-
      手机端的启动推流按钮从开始手机摄像头传输的唯一入口改为其中一种传输入口。
      第一种查看手机摄像头内容的方式：手机手动发送。
      初始状态下，单击手机端"共享摄像头"界面里的"启动推流"按钮后，
      自动把画面推送给电脑，并且电脑端无需手动单击"查看手机摄像头"按钮，
      就可以直接弹出窗口，显示手机摄像头界面，
      且电脑端的"切换手机摄像头"按钮移动到弹出的窗口中，
      所以去掉当前"共享摄像头"界面内的"切换手机摄像头"按钮。
      再在电脑弹窗内添加按钮"停止查看手机摄像头"，
      当单击手机端停止推流（从启动推流变成停止推流）按钮
      或电脑端弹窗内"停止查看手机摄像头"按钮，
      停止发送手机摄像头的画面并且手机端停止获取手机摄像头的内容。
      结束后手机端的预览界面清空，重置回原来的纯黑界面；
      第二种查看手机摄像头内容的方式：电脑请求，手机自动发送。
      初始状态下，单击电脑端的"共享摄像头"界面里的查看手机摄像头后，
      自动发送获取手机摄像头的指令并显示查看窗口。
      手机端无需确认，自动开始推送摄像头内容，包括锁屏状态下。
      此时，停止查看手机摄像头界面的操作只能在电脑端执行，
      手机端的停止推流按钮禁用。

  - &S8b
    id: S8b
    description: >-
      电脑端的"电脑摄像头→手机"按钮从开始电脑摄像头传输的唯一入口改为其中一种传输入口。
      第一种查看电脑摄像头内容的方式：电脑手动发送。
      初始状态下，单击电脑端"共享摄像头"界面里的"电脑摄像头→手机"按钮后，
      把"电脑摄像头→手机"按钮更新为"停止获取摄像头画面"，
      自动把画面推送给手机，并且自动弹出预览窗口，
      且手机端无需手动进入"共享摄像头界面"，
      就可以自动进入软件并进入"共享摄像头界面"界面，显示电脑摄像头界面，
      再在电脑弹窗内添加按钮"停止获取摄像头画面"，
      且主界面的"电脑摄像头→手机"按钮更新为"停止获取摄像头画面"按钮，
      当单击手机端"停止获取电脑摄像头画面"
      （从按钮"查看电脑摄像头"变过来的）按钮
      或电脑端弹窗内"停止获取摄像头画面"按钮，
      都可以停止发送电脑摄像头的画面并关掉电脑摄像头。
      结束后手机端的预览界面清空，重置回原来的纯黑界面；
      第二种查看电脑摄像头内容的方式：手机请求，电脑自动发送，
      无需弹出预览窗口，只更新按钮的UI，
      把"电脑摄像头→手机"按钮更新为"停止获取摄像头画面"。
      初始状态下，单击手机端的"共享摄像头"界面里的"查看电脑摄像头"按钮后，
      自动发送获取电脑摄像头的指令并开始获取摄像头画面。
      电脑端无需确认，自动开始推送摄像头内容。
      此时，停止查看电脑摄像头界面的操作只能在手机端执行，
      电脑端的"停止获取摄像头画面"禁用，
      停止后手机端的预览界面清空，重置回原来的纯黑界面，
      并且电脑端那个禁用的按钮启用，文字切换回去。

  - &S8c
    id: S8c
    description: >-
      总结S8a与S8b，UI优化：
      手机端无需改动；
      电脑端，去掉"共享摄像头"界面里的"切换手机摄像头"、"查看电脑摄像头"按钮，
      只保留"电脑摄像头→手机"与"查看手机摄像头"按钮；
      电脑端弹出的预览手机摄像头的弹窗中新增"切换手机摄像头"与"停止查看手机摄像头"；
      电脑端弹出的预览电脑摄像头的弹窗中新增"停止获取摄像头画面"按钮；
      电脑端出现了两个重名的停止获取摄像头画面的按钮，一个在弹窗里，一个在主页面，
      它们都可以正常使用，只是位置不同。

  - &S9
    id: S9
    description: >-
      输入网页后给手机推送，如果检测到手机端在桌面或Phonehub这两个软件，
      就不把网页复制到剪贴板，直接通过via浏览器进入，然后保存历史；
      否则只保存历史并把网页放到剪贴板内

  - &S10
    id: S10
    description: >-
      在手机端启动投屏服务时，使用 MediaProjectionManager 获取媒体投影权限，
      并确保前台服务声明中包含 foregroundServiceType="mediaProjection"。
      在 AndroidManifest.xml 中为对应 Service 添加
      android:foregroundServiceType="mediaProjection" 属性，
      并在启动服务时调用 Service.startForeground(id, notification,
      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)。

  - &S11
    id: S11
    description: >-
      在开始声音传输前，动态申请并检查音频录制权限 (RECORD_AUDIO)。
      若需要捕获系统内部音频（声韵传输），则需同时获取 MediaProjection 权限，
      并创建 AudioPlaybackCaptureConfiguration 来捕获音频播放内容。
      确保在 AndroidManifest.xml 中声明了
      <uses-permission android:name="android.permission.RECORD_AUDIO" />
      及相应的前台服务类型。

  - &S12
    id: S12
    description: >-
      使用 Storage Access Framework (SAF) 或直接通过文件路径访问手机文件时，
      需确保持有 MANAGE_EXTERNAL_STORAGE 权限或用户已通过 SAF 授予对根目录的访问权限。
      若使用传统文件 I/O，需在 Android 11+ 上声明
      <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
      tools:ignore="ScopedStorage" /> 并引导用户前往设置授予“所有文件访问权限”。
      同时检查代码中是否因路径拼接错误（如使用了 /Android/data/... 而非实际公共目录）导致列表为空。

  - &S13
    id: S13
    description: >-
      在电脑端点击保存时，获取原始文件名（即手机端发送时使用的文件名）。
      判断该文件名是否包含 '.' 字符：
      - 若包含，则直接使用该文件名保存。
      - 若不包含，则在文件名末尾添加 ".txt" 后缀后保存。
      将修改后的文件名作为保存对话框的默认文件名。

detailed_info:
  - &L1
    id: L1
    description: >-
      接收China-E.mp3，手机端的历史记录里出现了两项，
      一项是[接收] China-E.mp3，一项是[接收] 接收完成 China-E.mp3。
      其中，前者单击可以正常播放，后者单击提示文件不存在。
    solution_ref: *S1

  - &L2
    id: L2
    description: >-
      初始化投屏失败：
      Media projections require a foreground service of type
      Servicelnfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION，修复错误。
    solution_ref: *S10

  - &L3
    id: L3
    description: >-
      首先，调整音量功能完全正常。点击静音后，电脑端没有任何状态显示，
      应该改为S7a；手机端自动调整音量时，传输到电脑后，
      电脑又会把这些音量设置传回去，并且由于延迟较高，
      导致旧的音量设定又传回手机，手机的音量开始反复横跳，
      解决方案S7b
    solution_ref:
      - *S7a
      - *S7b

  - &L4
    id: L4
    description: >-
      单击"手机截图"按钮后，手机端出现了"是否允许...录制/投射您的屏幕"的请求，
      并且每次单击都需要重新授予权限，且无法正常截图，修复逻辑S7c
    solution_ref: *S7c

mistakes:
  - id: M1
    description: "手机端接收电脑端文件时的逻辑不对，应该是S4"
    solution_ref: *S4

  - id: M2
    description: "手机端接收文件后的传输历史有概率出现重复的记录"
    detailed_info_ref: *L1
    solution_ref: *S1

  - id: M3
    description: >-
      电脑端发送和之前重名的文件后，电脑端显示完成，手机端没有任何反应，
      进入手机端的文件传输界面里，没有任何新记录
    solution_ref: *S3

  - id: M4
    description: >-
      电脑端的剪贴板同步里，下面的历史记录只应该显示剪贴板复制的历史，
      而不是全部的传输历史；下面的历史记录和收藏项后还有个无用的加号，去掉
    solution_ref: *S2
    additional_action: "去掉历史记录和收藏项后的无用的加号"

  - id: M5
    description: >-
      电脑端的文字互传里，点击保存后的保存格式应该是手机端发送时的格式，
      而不是手机端发送的文件名.txt
      （只有检测到手机端传入了文件名且其中不包括'.'，才添加.txt到最后）
    solution_ref: *S13

  - id: M6
    description: "手机端的“投屏+反向控制”界面里，点击启动推流后授予权限后出现错误"
    detailed_info_ref: *L2
    solution_ref: *S10

  - id: M7
    description: "手机端投屏给电脑端的逻辑修改为S5"
    solution_ref: *S5

  - id: M8
    description: >-
      手机端当前点击声音传输，没有获取任何权限来获取媒体声音，
      进而无法正常使用声韵传输的功能。核心问题等价于无法正常获取媒体的声音
    solution_ref: *S11

  - id: M9
    description: "手机端声音传输给电脑的逻辑修改为S6"
    solution_ref: *S6

  - id: M10
    description: "电脑端“投屏与反向控制”内，快捷控制中，音量调整的问题"
    detailed_info_ref: *L3
    solution_ref:
      - *S7a
      - *S7b

  - id: M11
    description: "电脑端“投屏与反向控制”内，快捷控制中，手机截图出现的问题"
    detailed_info_ref: *L4
    solution_ref: *S7c

  - id: M12
    description: >-
      共享摄像头逻辑修改：
      手机摄像头推送给电脑的逻辑修改为S8a，
      电脑摄像头推送给手机的逻辑修改为S8b；
      最后界面优化成S8c
    solution_ref:
      - *S8a
      - *S8b
      - *S8c

  - id: M13
    description: >-
      电脑端的"远程文件管理"里无法获取手机的文件列表，
      我已经授予了权限，但是无法获取，修复错误。
    solution_ref: *S12

  - id: M14
    description: "电脑端的"推送网页"界面，逻辑不对，应该是S9"
    solution_ref: *S9

warnings:
  - id: W1
    description: >-
      手机端远程文件管理里，去掉第一行的手机文件和电脑文件的选择，
      只保留电脑文件的查看的所有逻辑。且查看里面的按钮，不应该只有上级和刷新按钮，
      应该再加上排序按钮，上级、刷新、排序按钮右边再来个操作按钮，默认禁用。
      长按一个文件可以进行多选（单选也可以），然后禁用的操作按钮启用，
      单击显示下拉菜单，单选的话，里面有：
      "打开（下载后自动打开）"、"下载"、"删除"、"重命名"、
      "属性（弹窗显示它的大小，创建日期，修改日期，类型，显示UI时没有该括号里的文字）"、
      "复制到（参照电脑端'远程文件管理'里操作手机文件的复制到的操作，显示UI时没有该括号里的文字）"

  - id: W2
    description: >-
      电脑端APK安装界面，"选择APK安装"和拖入文件合并成一个既能拖入文件，
      也能选择文件的按钮，因此去掉原有的"选择APK安装"按钮，
      把拖入文件的组件改成那个新的组件

  - id: W3
    description: >-
      电脑端的设置里的"手机端设置（PC显示状态）"项改成"手机端设置"，
      并且下面有一个"(未知)"，查看是否有逻辑，有的话修复显示未知的错误，
      没有则删掉这个

search_tasks:
  - description: "安卓截屏功能的实现方法"
    related_to: L4