# LiveMap 独立测试工程构建参数
# 注意：java.home 用 F: 实路径（不要用 C:\PhoneHub 的 junction），
# 否则 Kotlin 增量缓存会出现 C:/F: 根路径不匹配的问题。
android.useAndroidX=true
org.gradle.java.home=F:/PhoneHub/jdk17
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=34,35,36
kotlin.daemon.jvmargs=-Xmx1024m
android.nonTransitiveRClass=true
