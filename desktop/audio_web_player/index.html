<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PhoneHub · 电脑声音</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1216; color: #e8eaed; text-align: center;
  }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: #8b95a1; font-size: 13px; margin-bottom: 26px; }
  #status { margin-top: 18px; font-size: 15px; padding: 12px; border-radius: 10px; background: #1a1f27; min-height: 20px; }
  #info { margin-top: 10px; color: #8b95a1; font-size: 13px; }

  .media { margin-top: 20px; display: flex; align-items: center; gap: 14px; background: #1a1f27; padding: 14px; border-radius: 12px; text-align: left; }
  .media.hidden { display: none; }
  .cover { width: 72px; height: 72px; border-radius: 8px; background: #2a2f37; object-fit: cover; flex: 0 0 auto; }
  .meta { min-width: 0; }
  .mtitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .martist { font-size: 13px; color: #8b95a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mstatus { margin-top: 6px; font-size: 12px; color: #6b7480; }
  .mstatus.playing { color: #36d07b; }

  .controls { margin-top: 26px; }
  #toggleBtn {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
    color: #fff; background: #2f6df0; border: none; border-radius: 12px;
  }
  #toggleBtn.paused { background: #2a2f37; color: #cfd6df; }
  .skipRow { margin-top: 12px; display: flex; gap: 12px; }
  .skipRow button {
    flex: 1; padding: 13px; font-size: 15px; color: #cfd6df;
    background: #1a1f27; border: none; border-radius: 12px;
  }
  .skipRow button:active { background: #232a33; }
  #toggleBtn:active { filter: brightness(0.92); }
</style>
</head>
<body>
  <h1>电脑声音实时收听</h1>
  <div class="sub">打开本页自动收听电脑正在播放的声音</div>

  <div id="status">连接中…</div>
  <div id="info"></div>

  <div id="media" class="media hidden">
    <img id="cover" class="cover" alt="">
    <div class="meta">
      <div id="mTitle" class="mtitle">—</div>
      <div id="mArtist" class="martist">—</div>
      <div id="mStatus" class="mstatus">—</div>
    </div>
  </div>

  <div class="controls">
    <button id="toggleBtn" onclick="pcAudioToggle()">开始播放电脑声音</button>
    <div class="skipRow">
      <button onclick="pcAudioPrev()">上一曲</button>
      <button onclick="pcAudioNext()">下一曲</button>
    </div>
  </div>

<script>
let audioCtx = null, scriptNode = null, gainNode = null, ws = null;
let pending = [], readPos = 0, cfg = null;
let running = false;        // 手机端是否正在播放
let userPaused = false;     // 用户主动暂停（重连时不自动恢复）
let lastAudioAt = 0;        // 最近一次「有声音」的时间戳
let lastMsgAt = 0;          // 最近一次收到任意帧的时间戳
let reconnectDelay = 1000, reconnectTimer = null;

const $ = (id) => document.getElementById(id);
const statusEl = $("status"), infoEl = $("info");

// ===== 安卓 JS 桥（普通浏览器打开时为 undefined，需容错） =====
function brSetPlaying(v) { try { if (window.PcAudioBridge) PcAudioBridge.setPlaying(!!v); } catch (e) {} }
function brSetMedia(t, a, al, c, s) { try { if (window.PcAudioBridge) PcAudioBridge.setMedia(t || "", a || "", al || "", c || "", s || ""); } catch (e) {} }
function brPrev() { try { if (window.PcAudioBridge) PcAudioBridge.prev(); } catch (e) {} }
function brNext() { try { if (window.PcAudioBridge) PcAudioBridge.next(); } catch (e) {} }

function updateToggleBtn() {
  const btn = $("toggleBtn");
  if (!btn) return;
  btn.textContent = running ? "播放中" : "开始播放电脑声音";
  if (running) btn.classList.remove("paused");
  else btn.classList.add("paused");
}

function ensureCtx(rate) {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: rate || 48000 }); }
    catch (e) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  } else if (rate && audioCtx.sampleRate !== rate) {
    const old = audioCtx;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: rate });
    old.close();
  }
  return audioCtx;
}

function setupGraph() {
  if (scriptNode) { try { scriptNode.disconnect(); } catch (e) {} scriptNode = null; }
  scriptNode = audioCtx.createScriptProcessor(4096, 0, cfg.channels);
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;
  scriptNode.onaudioprocess = (e) => {
    const out = e.outputBuffer, frames = out.length;
    for (let c = 0; c < cfg.channels; c++) {
      const ch = out.getChannelData(c);
      for (let i = 0; i < frames; i++) {
        const idx = readPos + i * cfg.channels + c;
        ch[i] = (idx < 0 || idx >= pending.length) ? 0 : pending[idx];
      }
    }
    readPos += frames * cfg.channels;
    if (readPos > pending.length * 0.5) { pending.splice(0, readPos); readPos = 0; }
  };
  scriptNode.connect(gainNode);
  gainNode.connect(audioCtx.destination);
}

// ===== 连接（含断线自动重连，保证切后台/息屏后能恢复）=====
function connect() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;  // 正在连接/已连接
  statusEl.textContent = "连接中…";
  const proto = (location.protocol === "https:") ? "wss://" : "ws://";
  const wsPort = 4599;
  try {
    ws = new WebSocket(proto + location.hostname + ":" + wsPort + "/audio");
  } catch (e) { onSocketDown("连接失败"); return; }
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { reconnectDelay = 1000; lastMsgAt = Date.now(); statusEl.textContent = "已连接"; };
  ws.onmessage = onMsg;
  ws.onclose = () => onSocketDown("已断开");
  ws.onerror = () => onSocketDown("连接错误");
}

function onSocketDown(msg) {
  statusEl.textContent = msg + "，正在重连…";
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  scheduleReconnect();
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 8000);
}

async function onMsg(ev) {
  lastMsgAt = Date.now();
  if (typeof ev.data === "string") {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === "media_info") { updateMedia(msg); return; }
    if (msg.type === "media_status") { updateMedia({ status: msg.status }); return; }
    // 配置帧
    cfg = msg;
    ensureCtx(cfg.rate);
    if (!userPaused) { try { await audioCtx.resume(); } catch (e) {} }
    setupGraph();
    running = !userPaused;
    updateToggleBtn();
    infoEl.textContent = cfg.rate + "Hz / " + cfg.channels + "ch";
    if (running) brSetPlaying(true);
    if (audioCtx.state === "suspended") {
      statusEl.textContent = "轻触屏幕任意处开始播放";
      document.addEventListener("touchstart", () => {
        try { audioCtx.resume(); } catch (e) {}
        if (running) statusEl.textContent = "正在收听电脑声音";
      }, { once: true });
    } else {
      statusEl.textContent = "正在收听电脑声音";
    }
    return;
  }
  // 二进制 PCM(int16)：写入缓冲并检测「是否有声音」
  const arr = new Int16Array(ev.data);
  let peak = 0;
  for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (v > peak) peak = v; else if (-v > peak) peak = -v; }
  if (peak > 400) lastAudioAt = Date.now();
  for (let i = 0; i < arr.length; i++) pending.push(arr[i] / 32768);
  const max = cfg.rate * cfg.channels * 2;
  if (pending.length - readPos > max) {
    const drop = pending.length - readPos - max;
    pending.splice(0, drop); readPos -= drop;
  }
}

// ===== 供网页按钮 / 通知栏调用 =====
window.pcAudioToggle = function () {
  if (!audioCtx) return;
  if (running) {
    try { audioCtx.suspend(); } catch (e) {}
    running = false; userPaused = true;
  } else {
    try { audioCtx.resume(); } catch (e) {}
    running = true; userPaused = false;
  }
  updateToggleBtn();
  brSetPlaying(running);
};

window.pcAudioPrev = function () { brPrev(); };
window.pcAudioNext = function () { brNext(); };

// ===== 媒体信息展示 + 上报给安卓通知 =====
let mediaState = { title: "", artist: "", album: "", thumbnail: "", status: "stopped" };
let lastMediaCore = "";

function updateMedia(m) {
  if (m.title !== undefined)     mediaState.title = m.title;
  if (m.artist !== undefined)    mediaState.artist = m.artist;
  if (m.album !== undefined)     mediaState.album = m.album;
  if (m.thumbnail !== undefined) mediaState.thumbnail = m.thumbnail;
  if (m.status !== undefined)    mediaState.status = m.status;

  // 曲目变化时把最新媒体信息上报给安卓，用于实时刷新通知栏
  const core = (mediaState.title || "") + "|" + (mediaState.artist || "") + "|" +
               (mediaState.album || "") + "|" + (mediaState.thumbnail || "").length;
  if (core !== lastMediaCore) {
    lastMediaCore = core;
    brSetMedia(mediaState.title, mediaState.artist, mediaState.album, mediaState.thumbnail, mediaState.status);
  }

  const mediaEl = $("media");
  mediaEl.classList.remove("hidden");
  const stopped = (mediaState.status === "stopped"
                   || (!mediaState.title && !mediaState.artist && !mediaState.thumbnail));
  if (stopped) {
    $("mTitle").textContent = mediaState.title || "未检测到媒体播放";
    $("mArtist").textContent = mediaState.artist || "";
    if ($("cover").style.display !== "none") $("cover").style.display = "none";
    return;
  }
  if (mediaState.thumbnail) {
    if ($("cover").src !== mediaState.thumbnail) $("cover").src = mediaState.thumbnail;
    if ($("cover").style.display !== "block") $("cover").style.display = "block";
  } else {
    if ($("cover").style.display !== "none") $("cover").style.display = "none";
  }
  $("mTitle").textContent = mediaState.title || "未知曲目";
  $("mArtist").textContent = (mediaState.artist || "") + (mediaState.album ? " · " + mediaState.album : "");
}

// ===== 每秒刷新：真实播放状态（按是否有声音判断，避免「在放却显示已暂停」）=====
setInterval(() => {
  const now = Date.now();
  // 播放状态：最近 2 秒内收到过有声帧即视为播放中
  const playing = (now - lastAudioAt) < 2000;
  const st = $("mStatus");
  if (st) {
    if (playing) { st.textContent = "播放中"; st.classList.add("playing"); }
    else { st.textContent = mediaState.status === "stopped" ? "未播放" : "已暂停"; st.classList.remove("playing"); }
  }
  if (ws && ws.readyState === 1) {
    statusEl.textContent = playing ? "正在收听电脑声音" : "已连接（电脑端暂无声音）";
    // 连接超时（掉线但未触发 close）：主动重连
    if (now - lastMsgAt > 8000) onSocketDown("连接超时");
  } else if (!reconnectTimer && (!ws || ws.readyState === 3)) {
    scheduleReconnect();
  }
}, 1000);

// 回到前台时恢复音频上下文 / 断线重连
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  try { if (audioCtx && !userPaused) audioCtx.resume(); } catch (e) {}
  if (!ws || ws.readyState > 1) connect();
});

updateToggleBtn();
connect();
</script>
</body>
</html>
